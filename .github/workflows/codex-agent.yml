name: codex-agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  codex-agent:
    if: ${{ github.event.label.name == 'agent:codex' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create agent branch
        id: branch
        run: |
          BRANCH="codex/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          prompt: |
            Read AGENTS.md for project context and build commands.

            Fix issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            When done, verify your changes:
            1. mix compile --warnings-as-errors
            2. mix test
            3. mix credo --strict
            4. mix format --check-formatted

      - name: Push changes and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          git config user.name "codex[bot]"
          git config user.email "codex[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add -A
          git commit -m "fix: resolve issue #${{ github.event.issue.number }}

          ${{ github.event.issue.title }}

          Co-Authored-By: Codex <codex[bot]@users.noreply.github.com>"

          git push origin "$BRANCH"

          gh pr create \
            --title "fix: ${{ github.event.issue.title }}" \
            --body "Resolves #${{ github.event.issue.number }}

          ## Summary
          Automated fix by Codex agent.

          ## Verification
          - [ ] \`mix compile --warnings-as-errors\` passes
          - [ ] \`mix test\` passes
          - [ ] \`mix credo --strict\` passes
          - [ ] \`mix format --check-formatted\` passes" \
            --label "agent-pr" \
            --head "$BRANCH"
