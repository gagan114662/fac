name: codex-agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  codex-agent:
    if: ${{ github.event.label.name == 'agent:codex' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create agent branch
        id: branch
        run: |
          BRANCH="codex/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Restore Codex auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          mkdir -p ~/.codex
          echo "$CODEX_AUTH_JSON" > ~/.codex/auth.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Codex CLI
        run: npm install -g @openai/codex@latest

      - name: Run Codex
        run: |
          codex exec --full-auto "Read AGENTS.md for project context and build commands.

          Fix issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

          ${{ github.event.issue.body }}

          When done, verify your changes:
          1. mix compile --warnings-as-errors
          2. mix test
          3. mix credo --strict
          4. mix format --check-formatted"

      - name: Push changes and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          git config user.name "codex[bot]"
          git config user.email "codex[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add -A
          git commit -m "fix: resolve issue #${{ github.event.issue.number }}

          ${{ github.event.issue.title }}

          Co-Authored-By: Codex <codex[bot]@users.noreply.github.com>"

          git push origin "$BRANCH"

          # Extract Linear issue tag from title (e.g. [GET-42])
          LINEAR_TAG=$(echo "${{ github.event.issue.title }}" | grep -oE '\[GET-[0-9]+\]' || true)
          LINEAR_LINK=""
          if [ -n "$LINEAR_TAG" ]; then
            LINEAR_LINK="Linear: ${LINEAR_TAG}"
          fi

          gh pr create \
            --title "fix: ${{ github.event.issue.title }}" \
            --body "Resolves #${{ github.event.issue.number }}

          ## Summary
          Automated fix by Codex agent for: ${{ github.event.issue.title }}

          ## Linear Issue
          ${LINEAR_LINK:-_No Linear issue linked._}

          ## Acceptance Criteria
          _Populated automatically by \`pr-review-harness\` after CI runs._
          - [ ] Risk policy gate passed
          - [ ] CodeRabbit review clean
          - [ ] CI pipeline passed
          - [ ] Browser evidence verified (if UI change)

          ## Validation Artifacts
          _Populated automatically by \`pr-review-harness\` workflow._

          ## Execution Evidence
          _Screenshots, videos, and recordings attached by harness automation._" \
            --label "agent-pr" \
            --head "$BRANCH"
