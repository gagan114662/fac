name: claude-agent

on:
  issues:
    types: [labeled, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude-agent:
    if: >-
      ${{
        github.event.label.name == 'agent:claude' ||
        (github.event.action == 'assigned' && github.event.assignee.login == 'claude')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create agent branch
        id: branch
        run: |
          BRANCH="claude/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code@latest

      - name: Run Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude --print --max-turns 20 "Read AGENTS.md for project context and build commands.

          Fix issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

          ${{ github.event.issue.body }}

          Write the code changes needed. Create any new files required.
          Do NOT try to run mix commands - Elixir is not installed in this environment.
          Focus on writing correct Elixir code based on the existing codebase patterns."

      - name: Push changes and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add -A
          git commit -m "fix: resolve issue #${{ github.event.issue.number }}

          ${{ github.event.issue.title }}

          Co-Authored-By: Claude <claude[bot]@users.noreply.github.com>"

          git push origin "$BRANCH"

          gh pr create \
            --title "fix: ${{ github.event.issue.title }}" \
            --body "Resolves #${{ github.event.issue.number }}

          ## Summary
          Automated fix by Claude agent.

          ## Verification
          - [ ] \`mix compile --warnings-as-errors\` passes
          - [ ] \`mix test\` passes
          - [ ] \`mix credo --strict\` passes
          - [ ] \`mix format --check-formatted\` passes" \
            --label "agent-pr" \
            --head "$BRANCH"
